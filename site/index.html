<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title and the two descriptions are filled in from the snapshot at build time: see vite.config.ts and src/html-facts.ts. -->
    <title>{{site_title}}</title>
    <meta name="description" content="{{site_description}}" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1b2328" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1316" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint. Storage can be unavailable (private mode); fall back to the system setting.
      try { var t = localStorage.getItem("crossroads-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://flycrossroads.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crossroads Executive & Charter" />
    <meta property="og:title" content="Crossroads Executive & Charter · Fictional virtual airline" />
    <meta property="og:description" content="{{social_description}}" />
    <meta property="og:url" content="https://flycrossroads.com/" />
    <meta property="og:image" content="https://flycrossroads.com/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crossroads Executive &amp; Charter: light jets to the A380 and 777F, with executive, charter, sports and cargo flying. A fictional virtual airline for flight simulation from Indianapolis." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://flycrossroads.com/og.png?v=2" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Crossroads Executive & Charter",
        "description": "Fictional flight simulation virtual airline based in Indianapolis, Indiana. Not a real air carrier or charter operator and not affiliated with any real company.",
        "url": "https://flycrossroads.com/",
        "logo": "https://flycrossroads.com/og.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family:sans-serif;padding:24px">Crossroads Executive &amp; Charter is a fictional virtual airline for flight simulation, based in Indianapolis. It is not a real air carrier or charter operator and is not affiliated with any real company. Please enable JavaScript to see our fleet, routes and live flights.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
